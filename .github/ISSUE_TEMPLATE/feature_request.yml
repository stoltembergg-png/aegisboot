name: Feature Request (CI / Tooling / Distro)
description: Suggest an enhancement for AegisBoot CI/CD, automation scripts, Docker, or packaging.
title: "[FEAT]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Remember: Features for core OpenCore C bootloader components should be submitted directly to `acidanthera/OpenCorePkg`.

  - type: textarea
    id: feature_summary
    attributes:
      label: Feature Description
      description: What downstream capability or CI/CD enhancement would you like to see?
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Value & Rationale
      description: Why is this feature valuable for the continuous distribution?
    validations:
      required: true
